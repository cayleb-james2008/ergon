- id: fleet-core
  config:
    fleetRoot: /tmp/checker-031-pre.ohS0RG/fleet
    dbPath: /tmp/checker-031-pre.ohS0RG/fleet/state/fleet.db
    logDir: /tmp/checker-031-pre.ohS0RG/fleet/log
    workRoot: /tmp/checker-031-pre.ohS0RG/fleet/work
    controlSocket: /tmp/checker-031-pre.ohS0RG/ctl/control.sock
    sandboxProviderId: fleet-sandbox
    peerUid: 1000
    denyCgroupUnits: []
- id: fleet-sandbox
  config:
    bwrapPath: /usr/bin/bwrap
    nodePath: /usr/bin/node
    maskRoots: [/tmp/checker-031-pre.ohS0RG/fleet/dsh, /tmp/checker-031-pre.ohS0RG/fleet/state, /tmp/checker-031-pre.ohS0RG/fleet/log, /tmp/checker-031-pre.ohS0RG/fleet/work, /tmp/checker-031-pre.ohS0RG/fleet/backups, /tmp/checker-031-pre.ohS0RG/fleet/checks]
    egressSocket: /tmp/checker-031-pre.ohS0RG/ctl/egress.sock
    tmpSizeMiB: 512
- id: fleet-egress
  config:
    socketPath: /tmp/checker-031-pre.ohS0RG/ctl/egress.sock
    logPath: /tmp/checker-031-pre.ohS0RG/fleet/log/egress.jsonl
    allow: [registry.npmjs.org]
    allowPorts: [80, 443]
    connectTimeoutMs: 10000
    idleTimeoutMs: 300000
    guardInProcess: true
- id: fleet-lessons
  config:
    skillDir: /tmp/checker-031-pre.ohS0RG/fleet/skills
- id: fleet-housekeeper
  config:
    fleetRoot: /tmp/checker-031-pre.ohS0RG/fleet
    recoveryFile: /tmp/checker-031-pre.ohS0RG/recovery.pub
    agePath: /usr/bin/age
    ageKeygenPath: /usr/bin/age-keygen
- id: session-query-sqlite
  config:
    path: /tmp/checker-031-pre.ohS0RG/fleet/state/session-query.sqlite
    openAt: first-search
- id: fleet-policy
  config:
    logFile: /tmp/checker-031-pre.ohS0RG/fleet/log/actions.jsonl
    confirmDir: /tmp/checker-031-pre.ohS0RG/fleet/state/confirms
    peerUid: 1000
- id: fleet-roster
  config:
    checksRoot: /tmp/checker-031-pre.ohS0RG/fleet/checks
    gitRoot: /tmp/checker-031-pre.ohS0RG/fleet/gitwork
    engineRoot: /tmp/checker-031-pre.ohS0RG/fleet/engines
    credentialStore: /tmp/checker-031-pre.ohS0RG/dsh/.credentials.yaml
    sessionRoots: [/tmp/checker-031-pre.ohS0RG/dsh/sessions]
    engineSearchRoots: []
- id: fleet-mcp
  config:
    port: 40409
    bindSourceAllow: [loopback, tailnet]
    bindHosts: [127.0.0.1]
    statePath: /tmp/checker-031-pre.ohS0RG/fleet/state/mcp
    logPath: /tmp/checker-031-pre.ohS0RG/fleet/log/mcp-actions.jsonl
    adminSocket: /tmp/checker-031-pre.ohS0RG/ctl/mcp-admin.sock
    fleetRoot: /tmp/checker-031-pre.ohS0RG/fleet
    peerUid: 1000
    presetPrefix: fleet-
    stubProvider: fleet-selftest-stub
    stubModel: fleet-selftest-stub
    maxBodyBytes: 262144
    requestsPerMinute: 60
    maxSessions: 8
    turnTimeoutMs: 120000
    toolTimeoutMs: 180000
    controlTimeoutMs: 120000
    roundtripWaitMs: 30000
    pollMs: 500
    koffiPath: ''
    serverName: fleet-mcp
    protocolVersions: [2025-03-26, 2024-11-05]
    selftestAllowTools: []
