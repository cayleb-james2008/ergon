[package]
name = "ergon-rs"
version = "0.19.0"
edition = "2021"

[[bin]]
name = "ergon"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
rune = "0.14"
sha2 = "0.11"
miniz_oxide = "0.9"
pdf-extract = "0.12"

[build-dependencies]
miniz_oxide = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# Keep cold dependencies (Rune VM, PDF parser, TLS client) size-optimized while
# preserving opt-level = 3 on ergon-rs and hot JSON/HTTP/SHA-256 primitives.
[profile.release.package."*"]
opt-level = "z"

[profile.release.package.serde]
opt-level = 3

[profile.release.package.serde_core]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.itoa]
opt-level = 3

[profile.release.package.ryu]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.digest]
opt-level = 3

[profile.release.package.block-buffer]
opt-level = 3

[profile.release.package.cpufeatures]
opt-level = 3
