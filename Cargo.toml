[package]
name = "ergon-rs"
version = "0.40.0"
edition = "2021"

[[bin]]
name = "ergon"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
rune = { version = "0.14", default-features = false, features = ["std"] }
sha2 = "0.10"
ring = "0.17"
miniz_oxide = "0.9"
pdf-extract = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
miniz_oxide = "0.9"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Keep cold dependencies size-optimized while preserving opt-level = 3 on
# hot JSON/HTTP/SHA-256 primitives.
[profile.release.package."*"]
opt-level = "z"

[profile.release.package.itoa]
opt-level = 3

[profile.release.package.ryu]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.digest]
opt-level = 3

[profile.release.package.block-buffer]
opt-level = 3

[profile.release.package.cpufeatures]
opt-level = 3
