[package]
name = "ergon-rs"
version = "0.11.0"
edition = "2021"

[[bin]]
name = "ergon"
path = "src/main.rs"

[dependencies]
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
rune = "0.14"
sha2 = "0.11"
miniz_oxide = "0.9"
pdf-extract = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
